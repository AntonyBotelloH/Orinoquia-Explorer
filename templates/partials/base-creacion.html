{% extends 'partials/base-admin.html' %}
{% load static %}

{% block content %}
    <div class="container-lg">
        <div class="row">
            <div class="col-12">
                <h1>Crear {{titulo}}</h1>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Guardar</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
