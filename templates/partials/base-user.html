{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orinoquia Explorer</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    {% include 'nav' %}

    {% include 'header' %}
    
    <main class="container my-5">
        <div class="row">
            <div class="col-lg-8 mb-4">
                {% block content %}
                {% endblock content %}
                
            </div>
        </div>

        <div class="col-lg-4">
            {% include 'aside' %}
        </div>
    </main>
    {% include 'footer' %}

    {% block scripts %}
    {% endblock scripts %}
</body>
</html>
