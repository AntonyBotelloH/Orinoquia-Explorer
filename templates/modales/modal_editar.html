{% load crispy_forms_tags %}

<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content shadow border-0 rounded-4">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h4 class="modal-title fw-bold" id="modalEditarLabel" style="color: var(--brand-primary);">
                    <i class="bi bi-pencil-square me-2"></i>Editar {{ titulo|default:"Registro" }}
                </h4>
                <a href="{{ url_listar|default:'javascript:history.back()' }}" class="btn-close" aria-label="Cerrar"></a>
            </div>
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                <div class="modal-body px-4 py-3">
                    {% if subtitulo_editar %}
                        <p class="text-muted small mb-3">{{ subtitulo_editar }}</p>
                    {% endif %}
                    {{ form|crispy }}
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4 pt-2 gap-2">
                    <a href="{{ url_listar|default:'javascript:history.back()' }}" class="btn btn-light border px-4">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="bi bi-check2-circle me-1"></i> Actualizar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
