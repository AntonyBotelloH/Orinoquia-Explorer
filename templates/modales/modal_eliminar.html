<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0 rounded-4">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h4 class="modal-title fw-bold text-danger" id="modalEliminarLabel">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Eliminar {{ titulo|default:"Registro" }}
                </h4>
                <a href="{{ url_listar|default:'javascript:history.back()' }}" class="btn-close" aria-label="Cerrar"></a>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="modal-body px-4 py-3 text-center">
                    <div class="display-5 text-danger mb-3">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <p class="fs-5 mb-2">¿Estás seguro de que deseas eliminar este {{ titulo|lower|default:"registro" }}?</p>
                    <p class="fw-bold mb-2 fs-5" style="color: var(--brand-primary);">
                        {{ objeto|default:user }}
                    </p>
                    {% if descripcion_eliminar %}
                    <p class="text-muted small mb-3">{{ descripcion_eliminar }}</p>
                    {% endif %}
                    <div class="alert alert-warning py-2 small mb-0">
                        <i class="bi bi-info-circle me-1"></i> Esta acción no se puede deshacer.
                    </div>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4 pt-2 gap-2 justify-content-center">
                    <a href="{{ url_listar|default:'javascript:history.back()' }}" class="btn btn-light border px-4">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold">
                        <i class="bi bi-trash-fill me-1"></i> Sí, Eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
